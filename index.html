<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4759a8" />
    <meta name="description" content="Notas, turmas, frequência e agenda do professor" />
    <!-- iPhone/iPad: ícone e nome quando instalado pela "Adicionar à Tela de Início" -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Diário" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Diário — Gestão de Notas e Aulas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema antes da página pintar, pra não piscar claro e
      // depois escurecer quando o usuário já escolheu o modo escuro.
      (function () {
        try {
          var salvo = localStorage.getItem('diario:tema')
          var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = escuro ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
